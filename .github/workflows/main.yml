name: JavaFX Library CI

on:
  push:
    branches:
      - LibraryBookRecordApplication
  pull_request:
    branches:
      - LibraryBookRecordApplication

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      - name: Download JavaFX
        run: |
          wget https://download2.gluonhq.com/openjfx/26/openjfx-26_linux-x64_bin-sdk.zip
          unzip openjfx-26_linux-x64_bin-sdk.zip

      - name: Compile JavaFX application
        run: |
          cd LibraryBookRecordApplication
          mkdir -p out
          javac \
            --module-path ../javafx-sdk-26/lib \
            --add-modules javafx.controls \
            -d out \
            src/module-info.java \
            src/library/*.java
